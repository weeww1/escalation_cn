name: Update translation catalog

on:
  push:
    branches:
      - main
    paths:
      - "event/**/*.json"
      - "scripts/build_translations.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build translation catalog
        run: python scripts/build_translations.py

      - name: Commit updated catalog
        shell: bash
        run: |
          if git diff --quiet -- translations.json; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations.json
          git commit -m "Update translation catalog [skip ci]"
          git push
